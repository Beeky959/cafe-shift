<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#211e24">
<title>Byte Builds: Café Shift</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div class="app" id="app" data-phase="intro">
  <header class="hud" aria-label="Shift status">
    <div class="stat"><span class="stat-label">Time</span><strong id="hud-time">0:00</strong></div>
    <div class="stat"><span class="stat-label">Coins</span><strong id="hud-coins">0</strong></div>
    <div class="stat"><span class="stat-label">Served</span><strong id="hud-served">0</strong></div>
    <div class="stat"><span class="stat-label">Waiting</span><strong id="hud-waiting">0</strong></div>
    <div class="stat"><span class="stat-label">Lost</span><strong id="hud-lost">0</strong></div>
    <div class="stat questions" title="Time you have spent answering questions instead of serving"><span class="stat-label">Questions</span><strong id="hud-questions">0s</strong></div>
    <button class="hud-button" id="pause-button" type="button">Pause</button>
  </header>

  <main class="stage">
    <div class="scene-wrap">
      <canvas id="scene" aria-hidden="true"></canvas>
      <div class="targets" id="targets" role="group" aria-label="Café stations, counter spots and tables"></div>
    </div>
  </main>

  <div class="rail" id="rail" role="group" aria-label="Orders and questions: counter spots one to three, then the door"></div>

  <div class="strip" id="action-strip" role="group" aria-label="What you are doing, and what is next"></div>

  <p class="caption" id="byte-caption" data-mood="neutral"><span class="byte-name">Byte</span><span id="byte-text" role="status"></span></p>

  <div class="help">
    <p>Pick an order, make it, then carry it to the guest. Green outlines show where a carried item can go.</p>
    <p class="help-keys">Keys: <kbd>1</kbd> machine · <kbd>2</kbd> pastry case · <kbd>3</kbd> sink · <kbd>4</kbd>–<kbd>6</kbd> counter · <kbd>7</kbd>–<kbd>9</kbd> tables · <kbd>C</kbd> cancel · <kbd>P</kbd> pause</p>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-latte" viewBox="0 0 24 24"><path d="M4 8h12v7a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="#fffaf0" stroke="currentColor" stroke-width="2"/><path d="M16 10h2a2.5 2.5 0 0 1 0 5h-2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 3c1 1-1 2 0 3M12 3c1 1-1 2 0 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-croissant" viewBox="0 0 24 24"><path d="M3 15c1-6 5-9 9-9s8 3 9 9c-2-1-3-1-4 0-2-2-8-2-10 0-1-1-2-1-4 0z" fill="#c98a3c" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8l-1 6M12 7v6M15 8l1 6" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M3 10a13 13 0 0 1 18 0M6.5 13.5a8 8 0 0 1 11 0M10 17a3 3 0 0 1 4 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="20" r="1.4" fill="currentColor"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" fill="#fffaf0" stroke="currentColor" stroke-width="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-instagram" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="#fffaf0" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="7" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-review" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z" fill="#f2b532" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-website" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#fffaf0" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-washroom" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="#fffaf0" stroke="currentColor" stroke-width="2"/><text x="12" y="16" text-anchor="middle" font-size="9" font-weight="900" fill="currentColor">WC</text></symbol>
  </defs>
</svg>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <h1 id="overlay-title"></h1>
    <div id="overlay-body"></div>
    <button class="mainbtn" id="overlay-button" type="button"></button>
  </div>
</div>
<noscript>This game needs JavaScript.</noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
